# Server Configuration for Production (Render PORT binding)
server.port=${PORT:8080}

# Production Datasource - MySQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# H2 Console Configuration (Disable in production)
spring.h2.console.enabled=false

# JPA & Hibernate Settings for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Multipart Upload Size Limits (For Resume Uploads)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# App specific JWT properties
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationInMs=86400000
